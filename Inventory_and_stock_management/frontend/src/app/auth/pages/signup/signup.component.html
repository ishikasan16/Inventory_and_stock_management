<div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-100 via-slate-50 to-blue-50 px-2">
  <div class="w-full max-w-md rounded-2xl bg-white p-4 shadow-lg ring-1 ring-slate-200/60 transition-all duration-300">
    <div class="mb-8 text-center">
      <h1 class="text-xl font-semibold text-slate-900 sm:text-2xl">Create account</h1>
      <p class="mt-2 text-sm text-slate-500">Your role & team are assigned by the administrator after signup</p>
    </div>

    <p *ngIf="errorMessage" class="mb-4 rounded-lg bg-rose-50 p-3 text-sm text-rose-600 ring-1 ring-rose-200" role="alert">
      {{ errorMessage }}
    </p>

    <p *ngIf="successMessage" class="mb-4 rounded-lg bg-green-50 p-3 text-sm text-green-600 ring-1 ring-green-200" role="alert">
      {{ successMessage }}
    </p>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700">Username</label>
        <input id="username" type="text" [(ngModel)]="username" name="username" autocomplete="username"
          class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200"
          placeholder="johndoe" />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" autocomplete="email"
          class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200"
          placeholder="you@example.com" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" autocomplete="new-password"
          class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200"
          placeholder="Create a password" />
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-slate-700">Confirm Password</label>
        <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
          autocomplete="new-password"
          class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200"
          placeholder="Confirm your password" />
      </div>

      <button type="submit"
        class="w-full rounded-lg bg-gradient-to-r from-blue-600 to-blue-700 px-4 py-2.5 text-sm font-semibold text-white shadow-md shadow-blue-500/25 transition-all duration-200 hover:from-blue-700 hover:to-blue-800 hover:shadow-lg hover:shadow-blue-500/30 focus:outline-none focus:ring-4 focus:ring-blue-200">
        Create account
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Already have an account?
      <a routerLink="/login" class="font-medium text-blue-600 hover:text-blue-500 transition-colors duration-200">Sign in</a>
    </p>
  </div>
</div>
