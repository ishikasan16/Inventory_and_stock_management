<div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-100 via-slate-50 to-blue-50 px-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg ring-1 ring-slate-200/60 transition-all duration-300">
    <div class="mb-8 text-center">
      
      <h1 class="text-2xl font-semibold text-slate-900 sm:text-3xl">Inventory Stock Management</h1>
      <p class="mt-2 text-sm text-slate-500">Sign in to your account</p>
    </div>

    <p *ngIf="noticeMessage" class="mb-4 rounded-lg bg-blue-50 p-3 text-sm text-blue-700 ring-1 ring-blue-200" role="status">
      {{ noticeMessage }}
    </p>

    <p *ngIf="errorMessage" class="mb-4 rounded-lg bg-rose-50 p-3 text-sm text-rose-600 ring-1 ring-rose-200" role="alert">
      {{ errorMessage }}
    </p>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200"
          placeholder="you@example.com"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200"
          placeholder="Enter your password"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full rounded-lg bg-gradient-to-r from-blue-600 to-blue-700 px-4 py-2.5 text-sm font-semibold text-white shadow-md shadow-blue-500/25 transition-all duration-200 hover:from-blue-700 hover:to-blue-800 hover:shadow-lg hover:shadow-blue-500/30 focus:outline-none focus:ring-4 focus:ring-blue-200 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Don't have an account?
      <a routerLink="/signup" class="font-medium text-blue-600 hover:text-blue-500 transition-colors duration-200">Sign up</a>
    </p>
  </div>
</div>
