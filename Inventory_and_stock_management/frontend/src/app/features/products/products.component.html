<div class="mx-auto flex h-full max-w-7xl flex-col gap-1.5 sm:gap-2 px-1 sm:px-3 py-1">
  <div class="flex items-center justify-between gap-2">
    <div>
      <h1 class="text-base sm:text-xl font-semibold text-slate-900">Products</h1>
    </div>

    <a
      *ngIf="canCreateType()"
      routerLink="/products/add"
      class="inline-flex shrink-0 items-center justify-center rounded-lg bg-blue-600 px-2.5 py-1 text-xs sm:text-sm font-semibold text-white shadow-sm transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    >
      + Add Product
    </a>
  </div>

  <!-- Summary Cards: attractive dashboard style with icons -->
  <div class="grid grid-cols-3 gap-2 sm:gap-3.5">
    <!-- Total Products -->
    <article class="group relative flex items-center justify-between rounded-xl border-t-4 border-sky-500 bg-white p-3 sm:p-4 shadow-sm ring-1 ring-slate-200 transition-all duration-300 hover:shadow-md hover:ring-slate-300 hover:-translate-y-0.5">
      <div class="min-w-0 flex-1">
        <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-500 truncate">Total Products</p>
        <p class="mt-0.5 sm:mt-1.5 text-base sm:text-xl xl:text-2xl font-bold leading-tight text-slate-900 group-hover:text-sky-600 transition-colors duration-200">{{ total | number }}</p>
        <p class="mt-0.5 sm:mt-1 text-[11px] sm:text-xs text-slate-400 truncate">Active SKUs</p>
      </div>
      <div class="hidden sm:flex h-9 w-9 xl:h-10 xl:w-10 shrink-0 items-center justify-center rounded-xl bg-sky-50 text-sky-600 ring-1 ring-sky-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5 xl:h-5 xl:w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m7.5 4.27 9 5.15"/>
          <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
          <path d="m3.3 7 8.7 5 8.7-5"/>
          <path d="M12 22V12"/>
        </svg>
      </div>
    </article>

    <!-- Low Stock -->
    <article class="group relative flex items-center justify-between rounded-xl border-t-4 border-amber-500 bg-white p-3 sm:p-4 shadow-sm ring-1 ring-slate-200 transition-all duration-300 hover:shadow-md hover:ring-slate-300 hover:-translate-y-0.5">
      <div class="min-w-0 flex-1">
        <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-500 truncate">Low Stock</p>
        <p class="mt-0.5 sm:mt-1.5 text-base sm:text-xl xl:text-2xl font-bold leading-tight text-slate-900 group-hover:text-amber-600 transition-colors duration-200">{{ countByStatus('Low Stock') | number }}</p>
        <p class="mt-0.5 sm:mt-1 text-[11px] sm:text-xs text-slate-400 truncate">Below reorder</p>
      </div>
      <div class="hidden sm:flex h-9 w-9 xl:h-10 xl:w-10 shrink-0 items-center justify-center rounded-xl bg-amber-50 text-amber-600 ring-1 ring-amber-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5 xl:h-5 xl:w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
    </article>

    <!-- Out of Stock -->
    <article class="group relative flex items-center justify-between rounded-xl border-t-4 border-rose-500 bg-white p-3 sm:p-4 shadow-sm ring-1 ring-slate-200 transition-all duration-300 hover:shadow-md hover:ring-slate-300 hover:-translate-y-0.5">
      <div class="min-w-0 flex-1">
        <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-500 truncate">Out of Stock</p>
        <p class="mt-0.5 sm:mt-1.5 text-base sm:text-xl xl:text-2xl font-bold leading-tight text-slate-900 group-hover:text-rose-600 transition-colors duration-200">{{ countByStatus('Out of Stock') | number }}</p>
        <p class="mt-0.5 sm:mt-1 text-[11px] sm:text-xs text-slate-400 truncate">Zero quantity</p>
      </div>
      <div class="hidden sm:flex h-9 w-9 xl:h-10 xl:w-10 shrink-0 items-center justify-center rounded-xl bg-rose-50 text-rose-600 ring-1 ring-rose-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5 xl:h-5 xl:w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
        </svg>
      </div>
    </article>
  </div>

  <section class="mt-0.5 flex min-h-0 flex-1">
    <app-products-list
      class="block h-full w-full"
      [products]="products"
      [allProducts]="allProducts"
      [myTasks]="myTasks"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      [total]="total"
      [totalPages]="totalPages"
      (pageChange)="goToPage($event)"
    ></app-products-list>
  </section>
</div>
