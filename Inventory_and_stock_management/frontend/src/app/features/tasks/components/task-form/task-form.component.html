<form [formGroup]="form" (ngSubmit)="submit()" class="mt-4 space-y-4">
  <p *ngIf="errorMessage" class="rounded-lg bg-rose-50 p-3 text-sm text-rose-600 ring-1 ring-rose-200" role="alert">
    {{ errorMessage }}
  </p>

  <div>
    <label for="task-title" class="block text-sm font-medium text-slate-700">Title</label>
    <input id="task-title" type="text" formControlName="title" placeholder="e.g. Add stock for fridge"
      class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200" />
    <p *ngIf="form.controls['title'].touched && form.controls['title'].invalid" class="mt-1 text-xs text-rose-600">
      Title is required.
    </p>
  </div>

  <div>
    <label for="task-description" class="block text-sm font-medium text-slate-700">Description</label>
    <textarea id="task-description" formControlName="description" rows="3"
      placeholder="Optional details for the assignee"
      class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200"></textarea>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div>
      <label for="task-assignee" class="block text-sm font-medium text-slate-700">Assign to</label>
      <select id="task-assignee" formControlName="assigned_to_id"
        class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200">
        <option value="" disabled>Select a team member</option>
        <option *ngFor="let member of filteredAssignees" [value]="member.id">
          {{ member.email }}{{ member.role ? ' (' + formatRole(member.role) + ')' : '' }}
        </option>
      </select>
      <p *ngIf="form.controls['assigned_to_id'].touched && form.controls['assigned_to_id'].invalid"
        class="mt-1 text-xs text-rose-600">
        Assignee is required.
      </p>
    </div>

    <div>
      <label for="task-due" class="block text-sm font-medium text-slate-700">Due date</label>
      <input id="task-due" type="date" [min]="todayString" [attr.min]="todayString" formControlName="due_date"
        (change)="onDueDateChange()"
        class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200"
        [class.border-rose-400]="form.controls['due_date'].invalid && (form.controls['due_date'].touched || form.controls['due_date'].dirty)"
        [class.ring-1]="form.controls['due_date'].invalid && (form.controls['due_date'].touched || form.controls['due_date'].dirty)"
        [class.ring-rose-400]="form.controls['due_date'].invalid && (form.controls['due_date'].touched || form.controls['due_date'].dirty)" />
      <p *ngIf="form.controls['due_date'].errors?.['pastDate']" class="mt-1 text-xs text-rose-600">
        Due date must be today or a future date.
      </p>
    </div>
  </div>

  <div>
    <label for="task-priority" class="block text-sm font-medium text-slate-700">Priority</label>
    <select id="task-priority" formControlName="priority"
      class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200">
      <option value="LOW">Low</option>
      <option value="MEDIUM">Medium</option>
      <option value="HIGH">High</option>
    </select>
  </div>

  <div>
    <label for="task-target-type" class="block text-sm font-medium text-slate-700">Scope</label>
    <select id="task-target-type" formControlName="target_type" (change)="onTargetTypeChange()"
      class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200">
      <option *ngFor="let t of targetTypes" [value]="t">{{ formatTargetType(t) }}</option>
    </select>
    <p class="mt-1 text-xs text-slate-400">
      Select a scope to grant the assignee access linked to this record type.
    </p>
  </div>

  <div *ngIf="selectedTargetType !== 'NONE'">
    <label for="task-target-id" class="block text-sm font-medium text-slate-700">Linked {{ selectedTargetType |
      titlecase }}</label>
    <select id="task-target-id" formControlName="target_id"
      class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all duration-200">
      <option value="">Any (grants creating new {{ selectedTargetType | titlecase }}s)</option>
      <option *ngFor="let record of targetRecords" [value]="record.id">{{ record.name }}</option>
    </select>
    <p class="mt-1 text-xs text-slate-400">
      Pick a specific record to grant the assignee edit/delete access to it. Leave it empty to grant creating new ones
      instead.
    </p>
  </div>

  <div class="flex justify-end gap-2 sm:gap-3 pt-2">
    <button type="button" (click)="cancel()"
      class="rounded-lg border border-slate-300 px-2.5 py-1 sm:px-4 sm:py-2 text-xs sm:text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors duration-150">
      Cancel
    </button>
    <button type="submit" [disabled]="isSaving"
      class="rounded-lg bg-blue-600 px-2.5 py-1 sm:px-4 sm:py-2 text-xs sm:text-sm font-semibold text-white shadow-sm transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-40">
      {{ isSaving ? 'Saving…' : (task ? 'Save changes' : 'Assign task') }}
    </button>
  </div>
</form>
