<div class="mx-auto flex h-full max-w-7xl flex-col gap-1.5 sm:gap-2 px-1 sm:px-3 py-1">
  <div class="flex items-center justify-between gap-2">
    <div>
      <h1 class="text-base sm:text-xl font-semibold text-slate-900">Categories</h1>
    </div>

    <a
      *ngIf="canCreateType()"
      routerLink="/categories/add"
      class="inline-flex shrink-0 items-center justify-center rounded-lg bg-emerald-600 px-2.5 py-1 text-xs sm:text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2"
    >
      + Add Category
    </a>
  </div>

  <div class="flex">
    <article class="group relative flex items-center justify-between gap-4 rounded-xl border-t-4 border-emerald-500 bg-white p-3 sm:p-4 shadow-sm ring-1 ring-slate-200 transition-all duration-300 hover:shadow-md hover:ring-slate-300 hover:-translate-y-0.5 min-w-[160px] sm:min-w-[210px]">
      <div class="min-w-0 flex-1">
        <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-500 truncate">Total Categories</p>
        <p class="mt-0.5 sm:mt-1.5 text-base sm:text-xl xl:text-2xl font-bold leading-tight text-slate-900 group-hover:text-emerald-600 transition-colors duration-200">{{ total | number }}</p>
        <p class="mt-0.5 sm:mt-1 text-[11px] sm:text-xs text-slate-400 truncate">Active categories</p>
      </div>
      <div class="hidden sm:flex h-9 w-9 xl:h-10 xl:w-10 shrink-0 items-center justify-center rounded-xl bg-emerald-50 text-emerald-600 ring-1 ring-emerald-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5 xl:h-5 xl:w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
          <line x1="7" y1="7" x2="7.01" y2="7"/>
        </svg>
      </div>
    </article>
  </div>

  <section class="mt-0.5 flex min-h-0 flex-1">
    <app-categories-list
      class="block h-full w-full"
      [categories]="categories"
      [allCategories]="allCategories"
      [myTasks]="myTasks"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      [total]="total"
      [totalPages]="totalPages"
      (pageChange)="goToPage($event)"
    ></app-categories-list>
  </section>
</div>
