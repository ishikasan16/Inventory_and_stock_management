<main class="mx-auto max-w-5xl px-4 py-6 sm:px-6">
  <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <h1 class="mt-2 text-2xl font-semibold text-slate-900 sm:text-3xl">
      {{ isEditMode ? 'Edit Supplier' : 'Add Supplier' }}
    </h1>

    <button
      type="button"
      (click)="cancel()"
      class="self-start rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-medium text-slate-700 transition-all duration-200 hover:bg-slate-50 hover:shadow-sm"
    >
      Back to list
    </button>
  </div>

  <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <p *ngIf="errorMessage" class="mb-4 rounded-md bg-rose-50 p-3 text-sm text-rose-600" role="alert">
      {{ errorMessage }}
    </p>
    <form [formGroup]="supplierForm" (ngSubmit)="onSubmit()" class="grid gap-5 md:grid-cols-2">
      <div>
        <label for="supplier-name" class="mb-2 block text-sm font-medium text-slate-700">Supplier Name</label>
        <input
          id="supplier-name"
          type="text"
          formControlName="name"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-800 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200"
          [class.border-red-500]="supplierForm.get('name')?.touched && supplierForm.get('name')?.invalid"
        />
        <p *ngIf="supplierForm.get('name')?.touched && supplierForm.get('name')?.invalid" class="mt-1 text-xs text-red-600">
          Supplier name is required.
        </p>
      </div>

      <div>
        <label for="supplier-email" class="mb-2 block text-sm font-medium text-slate-700">Contact Email</label>
        <input
          id="supplier-email"
          type="email"
          formControlName="contact_email"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-800 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200"
          [class.border-red-500]="supplierForm.get('contact_email')?.touched && supplierForm.get('contact_email')?.invalid"
        />
        <p *ngIf="supplierForm.get('contact_email')?.touched && supplierForm.get('contact_email')?.invalid" class="mt-1 text-xs text-red-600">
          Enter a valid email address.
        </p>
      </div>

      <div>
        <label for="supplier-phone" class="mb-2 block text-sm font-medium text-slate-700">Phone</label>
        <input
          id="supplier-phone"
          type="tel"
          formControlName="phone"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-800 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200"
          [class.border-red-500]="supplierForm.get('phone')?.touched && supplierForm.get('phone')?.invalid"
        />
        <p *ngIf="supplierForm.get('phone')?.touched && supplierForm.get('phone')?.errors?.['required']" class="mt-1 text-xs text-red-600">
          Phone number is required.
        </p>
        <p *ngIf="supplierForm.get('phone')?.touched && supplierForm.get('phone')?.errors?.['pattern']" class="mt-1 text-xs text-red-600">
          Phone must be exactly 10 digits.
        </p>
      </div>

      <div>
        <label for="supplier-address" class="mb-2 block text-sm font-medium text-slate-700">Address</label>
        <textarea
          id="supplier-address"
          rows="2"
          formControlName="address"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-800 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200"
          [class.border-red-500]="supplierForm.get('address')?.touched && supplierForm.get('address')?.invalid"
        ></textarea>
      </div>

      <div class="md:col-span-2 flex flex-col gap-2.5 pt-2 sm:flex-row sm:justify-end">
        <button type="button" (click)="cancel()" class="rounded-lg sm:rounded-xl border border-slate-300 px-3 py-1.5 sm:px-4 sm:py-2 text-xs sm:text-sm font-medium text-slate-700 hover:bg-slate-50">
          Cancel
        </button>
        <button type="submit" [disabled]="isLoading" class="rounded-lg sm:rounded-xl bg-violet-600 px-3 py-1.5 sm:px-4 sm:py-2 text-xs sm:text-sm font-semibold text-white shadow-sm hover:bg-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60">
          {{ isLoading ? 'Saving...' : (isEditMode ? 'Update Supplier' : 'Save Supplier') }}
        </button>
      </div>
    </form>
  </section>
</main>
